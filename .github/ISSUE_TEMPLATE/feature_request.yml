name: Feature request
description: Suggest a local-first feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "请勿粘贴真实聊天内容、令牌或个人文件。"
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and safety
      options:
        - label: This proposal can be evaluated without uploading private user data.
          required: true
