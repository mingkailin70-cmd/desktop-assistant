name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Locked model status checks
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Long-run cooperative-stop checks
        shell: pwsh
        run: ./tools/test_xiaok_long_run_stop.ps1
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
      - name: Build
        run: dotnet build XiaoK.sln --configuration Release
      - name: Notification sample bounds checks
        run: dotnet run --project tests/XiaoK.Tools.SafetyChecks --configuration Release --no-build --no-restore -- --only-notification-sample-bounds
      - name: Code credential boundary checks
        run: dotnet run --project tests/XiaoK.Tools.SafetyChecks --configuration Release --no-build --no-restore -- --only-code-credential-boundary
      - name: File content search checks
        run: dotnet run --project tests/XiaoK.Tools.SafetyChecks --configuration Release --no-build --no-restore -- --only-file-content-search
      - name: Task history recovery guidance checks
        run: dotnet run --project tests/XiaoK.Tools.SafetyChecks --configuration Release --no-build --no-restore -- --only-task-history-display-policy
      - name: Task history checkpoint and restart recovery checks
        run: dotnet run --project tests/XiaoK.Tools.SafetyChecks --configuration Release --no-build --no-restore -- --only-task-history-checkpoints
      - name: Runtime task history recovery checks
        run: dotnet run --project tests/XiaoK.DesktopExperience.Checks --configuration Release --no-build --no-restore -- --only-runtime-task-history-recovery
      - name: Desktop experience checks
        run: dotnet run --project tests/XiaoK.DesktopExperience.Checks --configuration Release --no-build --no-restore
