name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Locked model status checks
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Long-run cooperative-stop checks
        shell: pwsh
        run: ./tools/test_xiaok_long_run_stop.ps1
      - name: MSIX install and rollback policy checks
        shell: pwsh
        run: ./tools/test_xiaok_msix_install_policy.ps1
      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ github.workspace }}\.tools\dotnet
        with:
          dotnet-version: 10.0.401
      - name: Verify pinned SDK location
        shell: pwsh
        run: |
          $dotnetExe = Join-Path $env:GITHUB_WORKSPACE '.tools\dotnet\dotnet.exe'
          if (-not (Test-Path -LiteralPath $dotnetExe)) {
            throw 'Pinned SDK was not installed at .tools/dotnet/dotnet.exe.'
          }
          $sdkVersion = (& $dotnetExe --version).Trim()
          if ($sdkVersion -ne '10.0.401') {
            throw "Expected pinned .NET SDK 10.0.401, found $sdkVersion."
          }
          if ($LASTEXITCODE -ne 0) { throw 'Pinned SDK version check failed.' }
      - name: Build
        run: dotnet build XiaoK.sln --configuration Release
      - name: Full safety checks
        run: dotnet run --project tests/XiaoK.Tools.SafetyChecks --configuration Release --no-build --no-restore
      - name: UI Automation privacy and mutation policy checks
        run: dotnet run --project tests/XiaoK.Tools.SafetyChecks --configuration Release --no-build --no-restore -- --only-ui-automation-policy
      - name: Desktop experience checks
        run: dotnet run --project tests/XiaoK.DesktopExperience.Checks --configuration Release --no-build --no-restore
      - name: UI Automation isolated worker probe
        run: dotnet run --project tests/XiaoK.DesktopExperience.Checks --configuration Release --no-build --no-restore -- --only-uia-worker-probe
      - name: AISHELL-3 isolated TTS evaluator contract checks
        run: dotnet run --project tools/XiaoK.RuntimeDiagnostics --configuration Release --no-build --no-restore -- --aishell3-contract
