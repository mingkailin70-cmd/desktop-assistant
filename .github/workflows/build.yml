name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Locked model status checks
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Long-run cooperative-stop checks
        shell: pwsh
        run: ./tools/test_xiaok_long_run_stop.ps1
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
      - name: Link pinned SDK for isolated child-process checks
        shell: pwsh
        run: |
          $dotnetExe = (Get-Command dotnet).Source
          $sdkVersion = (& $dotnetExe --version).Trim()
          if ($sdkVersion -ne '10.0.401') {
            throw "Expected pinned .NET SDK 10.0.401, found $sdkVersion."
          }
          $sdkRoot = Split-Path -Parent $dotnetExe
          $toolsRoot = Join-Path $env:GITHUB_WORKSPACE '.tools'
          $pinnedSdkRoot = Join-Path $toolsRoot 'dotnet'
          New-Item -ItemType Directory -Path $toolsRoot -Force | Out-Null
          if (Test-Path -LiteralPath $pinnedSdkRoot) {
            throw 'The CI checkout already contains .tools/dotnet; refusing to replace it.'
          }
          New-Item -ItemType Junction -Path $pinnedSdkRoot -Target $sdkRoot | Out-Null
          $linkedDotnetExe = Join-Path $pinnedSdkRoot 'dotnet.exe'
          if (-not (Test-Path -LiteralPath $linkedDotnetExe)) {
            throw 'Pinned SDK junction does not expose dotnet.exe.'
          }
          $linkedVersion = (& $linkedDotnetExe --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $linkedVersion -ne '10.0.401') {
            throw "Pinned SDK junction failed validation: $linkedVersion."
          }
      - name: Build
        run: dotnet build XiaoK.sln --configuration Release
      - name: Full safety checks
        run: dotnet run --project tests/XiaoK.Tools.SafetyChecks --configuration Release --no-build --no-restore
      - name: Desktop experience checks
        run: dotnet run --project tests/XiaoK.DesktopExperience.Checks --configuration Release --no-build --no-restore
